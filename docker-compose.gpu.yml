# Adds the NVIDIA GPU to the app container (Docker Desktop with WSL 2 on Windows, or nvidia-container-toolkit on Linux):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  app:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
